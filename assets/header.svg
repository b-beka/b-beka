.role{font:500 30px 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#79c0ff}
.meta{font:400 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif;fill:#8b949e}
.code{font:400 14px 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#c9d1d9}
</style>
